<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2? 
 family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="page-wrapper">
        <div class="card">
            <!-- Avatar -->
            <div class="card__avatar">
                <div class="avatar-img">
                    <img class="avatar-img" src="assets.img/image.png">
                </div> <!-- ใส่รูปทีหลัง -->
            </div>
            <!-- Info -->
            <div class="card__info">
                <h1 class="card__name"></h1>อโรฌา เฉลิมธำรงเวช</h1>
                <p class="card__role">Full Stack Developer</p>
            </div>
            <!-- Divider -->
            <hr class="divider">
            <!-- Links -->
            <div class="card__links">
                <a href="mailto:you@email.com" class="link-item">
                    <span class="link-icon">📧</span>
                    <span>6810270002@tsu.ac.th</span></a>
                <a href="https://github.com/username" class="link-item">
                    <span class="link-icon">🔗</span>
                    <span>github.com/username</span>
                </a>
                </div<hr class="divider">
                <!-- Skills -->
                <div class="card__skills">
                    <span class="skill-badge">HTML</span>
                    <span class="skill-badge">CSS</span>
                    <span class="skill-badge">JavaScript</span>
                    <span class="skill-badge">React</span>
                    <span class="skill-badge">Git</span>
                </div>
                <hr class="divider">
                <!-- Buttons -->
                <div class="card__actions">
                    <a href="#" class="btn btn--primary">View Portfolio</a>
                    <a href="#" class="btn btn--outline">Contact</a>
                </div>
            </div>
        </div>
</body>

</html>
